<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ashlee Chae</title>
  <meta name="description" content="Ashlee Chae — coming soon.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #faf8f5;
      --fg: #1c1b19;
      --muted: #6f6a63;
      --accent: #b4532a;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #141312;
        --fg: #f1ede7;
        --muted: #9a948b;
        --accent: #e08a5f;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: "Inter", system-ui, -apple-system, sans-serif;
      display: grid;
      place-items: center;
      padding: 24px 16px;
      -webkit-font-smoothing: antialiased;
    }
    main { text-align: center; max-width: 40rem; }
    h1 {
      font-family: "Fraunces", Georgia, serif;
      font-weight: 600;
      font-size: clamp(2.75rem, 10vw, 5.5rem);
      letter-spacing: -0.02em;
      line-height: 1;
    }
    .status {
      margin-top: 1.25rem;
      font-size: 0.8rem;
      font-weight: 500;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .status::before {
      content: "";
      display: inline-block;
      width: 6px;
      height: 6px;
      margin-right: 0.6em;
      border-radius: 50%;
      background: var(--accent);
      vertical-align: middle;
      animation: pulse 2s ease-in-out infinite;
    }
    a {
      display: inline-block;
      margin-top: 2.5rem;
      color: var(--fg);
      text-decoration: none;
      border-bottom: 1px solid var(--muted);
      padding-bottom: 2px;
      transition: color .2s, border-color .2s;
    }
    a:hover, a:focus-visible { color: var(--accent); border-color: var(--accent); }
    @keyframes pulse { 50% { opacity: 0.25; } }
    @media (prefers-reduced-motion: reduce) { .status::before { animation: none; } }
  </style>
</head>
<body>
  <main>
    <h1>Ashlee Chae</h1>
    <p class="status">Coming soon</p>
    <a href="mailto:alc2339@columbia.edu">alc2339@columbia.edu</a>
  </main>
</body>
</html>
